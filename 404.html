<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<title>Re:Zero — Арка 10 · Перенаправление</title>
<link rel="icon" type="image/png" href="favicon.png">
<script>
(function () {
  var path = window.location.pathname;
  var match = path.match(/^(.*\/)(10-[a-z0-9-]+)(?:\.html)?\/?$/i);
  if (match) {
    var base = match[1] || '/';
    var chapterId = match[2].toLowerCase();
    window.location.replace(base + '?chapter=' + encodeURIComponent(chapterId));
  }
})();
</script>
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px;
    font-family: Georgia, serif;
    background: #080c14;
    color: #ddd4c0;
    text-align: center;
  }
  @media (prefers-color-scheme: light) {
    body { background: #f0ebe0; color: #1a1610; }
  }
  main { max-width: 520px; }
  h1 { color: #c8a46a; font-weight: 400; letter-spacing: 0.12em; }
  p { line-height: 1.7; opacity: 0.85; }
  a {
    display: inline-block;
    margin-top: 16px;
    padding: 12px 24px;
    border: 1px solid rgba(200, 164, 106, 0.45);
    border-radius: 4px;
    color: inherit;
    text-decoration: none;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    font-size: 12px;
  }
</style>
</head>
<body>
  <main>
    <h1>Страница не найдена</h1>
    <p>Если вы перешли по старой ссылке на главу, она автоматически открывается через новый единый интерфейс читалки.</p>
    <a href="./">Перейти к оглавлению Арки 10</a>
  </main>
</body>
</html>
