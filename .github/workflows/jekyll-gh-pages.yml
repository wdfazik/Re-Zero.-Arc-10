name: Deploy static content to Pages

on:
  push:
    branches: ["main"] # Укажите вашу ветку, если она отличается (например, master)

  # Позволяет запустить деплой вручную во вкладке Actions
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Разрешаем только один одновременный деплой, отменяя старые зависшие задачи
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.' # Указывает, что весь корень репозитория — это ваш сайт

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
